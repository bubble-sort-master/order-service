databaseChangeLog:
  - changeSet:
      id: 4
      author: gleb elopov
      changes:
        - createIndex:
            tableName: orders
            indexName: idx_orders_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: orders
            indexName: idx_orders_status_deleted
            columns:
              - column:
                  name: status
              - column:
                  name: deleted
        - createIndex:
            tableName: order_items
            indexName: idx_order_items_order_id
            columns:
              - column:
                  name: order_id
        - createIndex:
            tableName: order_items
            indexName: idx_order_items_item_id
            columns:
              - column:
                  name: item_id
        - createIndex:
            tableName: items
            indexName: idx_items_name
            columns:
              - column:
                  name: name
      rollback:
        - dropIndex:
            tableName: orders
            indexName: idx_orders_user_id
        - dropIndex:
            tableName: orders
            indexName: idx_orders_status_deleted
        - dropIndex:
            tableName: order_items
            indexName: idx_order_items_order_id
        - dropIndex:
            tableName: order_items
            indexName: idx_order_items_item_id
        - dropIndex:
            tableName: items
            indexName: idx_items_name
