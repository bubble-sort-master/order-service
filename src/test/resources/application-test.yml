spring:
  jpa:
    hibernate:
      ddl-auto: none
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
jwt:
  secret: super-secret-key-at-least-32-characters-long-for-hmac-sha256
resilience4j.circuitbreaker:
  instances:
    user-service:
      failureRateThreshold: 50
      waitDurationInOpenState: 5s
      slidingWindowSize: 10